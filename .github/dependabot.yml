version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "02:00"
      timezone: America/New_York
    # Patch-level updates are merged automatically after all CI checks pass.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
      - dependency-name: eslint
        versions: [">=10.0.0 <11.0.0"]
