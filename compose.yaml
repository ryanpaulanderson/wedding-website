services:
  development:
    build:
      context: .
      target: development
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wedding
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 5s
      timeout: 5s
      retries: 10

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    profiles: ["test"]
    init: true
    ipc: host
    working_dir: /workspace
    environment:
      CI: "true"
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >
        corepack enable &&
        pnpm config set store-dir /pnpm/store &&
        pnpm install --frozen-lockfile &&
        pnpm build &&
        pnpm test:e2e
    volumes:
      - .:/workspace
      - e2e_node_modules:/workspace/node_modules
      - e2e_pnpm_store:/pnpm/store
    depends_on:
      database:
        condition: service_healthy

volumes:
  node_modules:
  pnpm_store:
  postgres_data:
  e2e_node_modules:
  e2e_pnpm_store:
